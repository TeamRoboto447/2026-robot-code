name: Generate Javadocs

on:
  push:
    branches: ['**']  # Any branch

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'  # FRC standard
          java-version: '21'  # 2026 FRC (adjust if needed)
          
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate Javadocs
        run: ./gradlew javadoc  # FRC output: build/docs/javadoc

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/docs/javadoc
          publish_branch: gh-pages
          keep_files: true
          destination_dir: ${{ github.ref_name }}

      - name: Cleanup deleted branch docs
        run: |
          # Fetch all remote branches
          git fetch --prune origin
          
          # List active branches (exclude gh-pages)
          mapfile -t ACTIVE_BRANCHES < <(git branch -r --list 'origin/*' | sed 's|origin/||' | grep -v '^gh-pages$')
          
          # Checkout gh-pages
          git checkout gh-pages
          
          # Remove dirs not matching active branches
          for dir in */; do
            branch_name="${dir%/}"
            if [[ ! " ${ACTIVE_BRANCHES[*]} " =~ " ${branch_name} " ]]; then
              echo "Removing deleted branch dir: $branch_name"
              rm -rf "$dir"
            fi
          done
          
          # Commit changes if any
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Cleanup Javadocs for deleted branches" || echo "No deleted branches to clean up"
          git push origin gh-pages