<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamRoboto447 Javadocs - Branch Selection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .info {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 4px;
        }
        .branch-list {
            list-style: none;
        }
        .branch-item {
            margin-bottom: 12px;
        }
        .branch-link {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: #f8f9fa;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .branch-link:hover {
            background: #667eea;
            color: white;
            transform: translateX(5px);
            border-color: #667eea;
        }
        .branch-icon {
            margin-right: 12px;
            font-size: 1.2em;
        }
        .branch-name {
            font-weight: 500;
            font-size: 1.1em;
        }
        .last-updated {
            color: #999;
            font-size: 0.9em;
            margin-top: 30px;
            text-align: center;
        }
        .no-branches {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Robot code javadocs</h1>
        <p class="subtitle">2026 Robot Code Documentation</p>
        
        <div class="info">
            <strong>Select a branch</strong> to view its generated Javadocs documentation.
        </div>
        
        <ul class="branch-list" id="branchList">
            <!-- Branches will be inserted here -->
            <li class="branch-item">
                <a href="./  HEAD -> origin/main/" class="branch-link">
                    <span class="branch-icon">📂</span>
                    <span class="branch-name">  HEAD -> origin/main</span>
                </a>
            </li>
            <li class="branch-item">
                <a href="./  development/" class="branch-link">
                    <span class="branch-icon">📂</span>
                    <span class="branch-name">  development</span>
                </a>
            </li>
            <li class="branch-item">
                <a href="./  gh-pages/" class="branch-link">
                    <span class="branch-icon">📂</span>
                    <span class="branch-name">  gh-pages</span>
                </a>
            </li>
            <li class="branch-item">
                <a href="./  main/" class="branch-link">
                    <span class="branch-icon">📂</span>
                    <span class="branch-name">  main</span>
                </a>
            </li>
            <li class="branch-item">
                <a href="./  refactor/javadocs/" class="branch-link">
                    <span class="branch-icon">📂</span>
                    <span class="branch-name">  refactor/javadocs</span>
                </a>
            </li>
            <li class="branch-item">
                <a href="./  refactor/update-photon/" class="branch-link">
                    <span class="branch-icon">📂</span>
                    <span class="branch-name">  refactor/update-photon</span>
                </a>
            </li>
        </ul>
        
        <div class="last-updated">
            Last updated: <span id="timestamp"></span>
        </div>
    </div>
    
    <script>
        // Display current timestamp
        document.getElementById('timestamp').textContent = new Date().toLocaleString();
    </script>
</body>
</html>
